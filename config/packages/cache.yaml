framework:
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                default_lifetime: 604800  # 7 days #31536000  # 1 year
                adapter: cache.adapter.redis_tag_aware
                provider: '%env(REDIS_PROVIDER)%/%env(REDIS_DB_PIMCORE)%'

    session:
        handler_id: '%env(REDIS_PROVIDER)%/%env(REDIS_DB_SESSION)%'
